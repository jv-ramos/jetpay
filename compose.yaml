# services:
#     server:
#         build:
#             context: .
#         ports:
#             - 9000:80
# The commented out section below is an example of how to define a PostgreSQL
# database that your application can use. `depends_on` tells Docker Compose to
# start the database before your application. The `db-data` volume persists the
# database data between container restarts. The `db-password` secret is used
# to set the database password. You must create `db/password.txt` and add
# a password of your choosing to it before running `docker-compose up`.
#     depends_on:
#       db:
#         condition: service_healthy
#   db:
#     image: postgres
#     restart: always
#     user: postgres
#     secrets:
#       - db-password
#     volumes:
#       - db-data:/var/lib/postgresql/data
#     environment:
#       - POSTGRES_DB=example
#       - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
#     expose:
#       - 5432
#     healthcheck:
#       test: [ "CMD", "pg_isready" ]
#       interval: 10s
#       timeout: 5s
#       retries: 5
# volumes:
#   db-data:
# secrets:
#   db-password:
#     file: db/password.txt
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: jetpay_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - jetpay_network
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        container_name: jetpay_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - jetpay_network
        depends_on:
            - app

    db:
        image: postgres:16-alpine
        container_name: jetpay_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: jetpay
            POSTGRES_USER: jetpay
            POSTGRES_PASSWORD: jetpay
        ports:
            - "5432:5432"
        volumes:
            - jetpay_pgdata:/var/lib/postgresql/data
        networks:
            - jetpay_network

networks:
    jetpay_network:
        driver: bridge

volumes:
    jetpay_pgdata:
